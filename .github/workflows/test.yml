name: test

on:
  push:
    branches: [main]
  # No base-branch filter: a stacked PR targets the branch below it, not main,
  # and `branches: [main]` silently skipped every job for those — leaving the
  # Cloudflare deploy previews as the only checks, which look green but test
  # nothing. Run on every PR regardless of base; the concurrency group below
  # still cancels superseded runs.
  pull_request:

# Cancel in-progress runs when a new commit lands on the same PR / branch.
# Each push gets a fresh, definitive result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default `GITHUB_TOKEN` permissions for every job in this workflow.
# `contents: read` is the minimum to clone the repo. None of these jobs
# write to the repo, comment on PRs, create releases, etc., so the
# default-broader scope was unnecessary attack surface (CodeQL rule
# `actions/missing-workflow-permissions`).
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the current Active LTS (supported through April 2027)
        # and what Cloudflare Pages runs by default. The codebase ships to
        # browsers, not Node, so the only Node-specific surface is the
        # build / test tooling. Single version is enough.
        task: [unit, typecheck, lint]
        # Lint is now a gate: the baseline is clean (0 errors). The
        # `eslint-plugin-security` follow-up is still open. Bundle-size
        # and `npm audit` gates already exist (see the `build` and
        # `audit` jobs below). CodeQL is not in this repo at all — it runs
        # from GitHub's default setup (Settings > Code security), weekly and
        # on every PR, so there's no workflow file here to read.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: install
        run: npm ci

      - name: run task
        run: |
          case "${{ matrix.task }}" in
            unit)      npm test ;;
            typecheck) npx tsc --noEmit ;;
            lint)      npm run lint ;;
          esac

  coverage:
    # Coverage gate. Thresholds live in vitest.config.ts and are set
    # just below the current numbers, so a PR that drops coverage
    # (e.g. removes a test file) fails the gate. Bump thresholds
    # upward as the suite grows.
    name: coverage threshold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage

  build:
    # Verifies the production bundle still compiles with the test changes
    # in place. Catches "the test setup leaked into the bundle" mistakes.
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Cache the vendored pandoc parts so build doesn't re-download ~58MB from
      # unpkg on every run — keyed on the vendor script (which pins the version),
      # so a version bump invalidates it. On a hit, prebuild's isCurrent() skips
      # the download; on a miss, the script retries transient failures.
      - name: cache pandoc wasm parts
        uses: actions/cache@v6
        with:
          path: |
            public/lib/pandoc/pandoc.wasm.part*
            public/lib/pandoc/pandoc.wasm.manifest.json
          key: pandoc-wasm-${{ hashFiles('scripts/vendor-assets.mjs') }}
      - run: npm run build
      - name: assert no test file in dist
        # Sanity check: tests/ MUST NOT end up in the production bundle.
        # If this finds anything, our tsconfig.app.json `include` got
        # widened or a test file got accidentally imported from src/.
        run: |
          if find dist -name '*.test.*' -print -quit | grep -q .; then
            echo "::error::Test files found in dist/ — production bundle contaminated"
            find dist -name '*.test.*'
            exit 1
          fi

      - name: bundle-size budget
        # Catches silent bundle bloat. The runtime ships every byte under
        # dist/assets/*.js to the browser; if the total drifts much past
        # the current size something has been pulled in unintentionally
        # (a tree-shaking regression, an accidental whole-library import,
        # a polyfill imported in app code, etc.). Threshold is the
        # current measurement (3.66 MiB) + ~10% headroom, so legitimate
        # growth is fine but quiet 30%-over-six-months drift fails CI.
        # Bump the budget upward in the same PR that legitimately grows
        # the bundle — that makes "is this growth justified?" a code-
        # review conversation instead of a thing nobody notices.
        run: |
          BUDGET_BYTES=4194304   # 4.0 MiB
          TOTAL=$(find dist/assets -name "*.js" -exec stat -c %s {} \; | awk '{s+=$1} END {print s+0}')
          echo "Total dist/assets JS: $TOTAL bytes (budget: $BUDGET_BYTES)"
          if [ "$TOTAL" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Bundle ${TOTAL}B exceeds budget ${BUDGET_BYTES}B (~$((TOTAL * 100 / BUDGET_BYTES))% of budget)."
            echo "Bump BUDGET_BYTES in test.yml if growth is justified."
            exit 1
          fi

  bundle-sync:
    # Catches drift between `tex/` source files and the committed
    # `public/lib/latex-templates.js` bundle. The runtime loads the
    # bundle (not the source) — so an editor change to `tex/main.tex`
    # without a rebuild silently ships stale templates to users. We
    # hit this exact bug in PR #67 (subject-underline fix went through
    # tex/ but the bundle wasn't regenerated, so the deployed PDF still
    # had the old behavior).
    #
    # Build script is `build-templates.mjs` (Node, deterministic).
    # The earlier bash+sed pipeline produced different output on macOS
    # (BSD sed) vs Linux (GNU sed), making this check fundamentally
    # unworkable cross-platform. Node string.replace is identical
    # across platforms.
    name: bundle in sync with tex/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: rebuild bundle and assert no diff
        run: |
          node build-templates.mjs
          if ! git diff --exit-code public/lib/latex-templates.js; then
            echo "::error::public/lib/latex-templates.js is out of sync with tex/ source."
            echo "Run \`node build-templates.mjs\` locally and commit the regenerated bundle."
            exit 1
          fi

  audit:
    # Vanilla `npm audit --audit-level=high` gate — zero exceptions. The
    # allowlist machinery this job used to carry existed for one advisory
    # chain (pdfjs-dist via @react-pdf-viewer, no upstream fix); the react-pdf
    # migration removed those packages, so the gate is now unconditional. If a
    # new high/critical advisory has no fix, discuss before reintroducing any
    # allowlist — the default answer is to replace the dependency.
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: high-severity audit
        run: npm audit --audit-level=high

  pdf-worker-sync:
    # Catches drift between the installed pdfjs-dist (via react-pdf) and the
    # vendored public/lib/pdf.worker.min.mjs the app serves as its pdf.js
    # worker. pdf.js hard-fails on a worker/API version mismatch, so a
    # react-pdf upgrade without a re-vendored worker would break every preview
    # surface at runtime while building green. Same guard pattern as
    # "bundle in sync with tex/" above.
    name: pdf worker in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: re-vendor worker and assert no diff
        run: |
          npm run sync:pdf-worker
          if ! git diff --exit-code public/lib/pdf.worker.min.mjs; then
            echo "::error::public/lib/pdf.worker.min.mjs is out of sync with the installed pdfjs-dist."
            echo "Run \`npm run sync:pdf-worker\` locally and commit the regenerated worker."
            exit 1
          fi

  compile-matrix:
    # End-to-end LaTeX + DOCX compile harness. Three test files run
    # under `tests/integration/`:
    #   - latex-compile.test.ts    : 380 pairwise fixtures × xelatex
    #   - docx-compile.test.ts     : 380 pairwise fixtures × pandoc
    #   - differential.test.ts     : 10 curated fixtures, asserts
    #                                 user-supplied subject text
    #                                 appears in BOTH extracted PDF
    #                                 and DOCX outputs (catches path
    #                                 divergence — exactly the kind of
    #                                 bug PR #67 had with subject
    #                                 underline).
    # Total ≈ 770 tests. Wall time ~5 min on Ubuntu's 4-vCPU runner
    # (xelatex dominates; pandoc + pdf-parse + mammoth are ~50× faster).
    name: compile matrix (LaTeX + DOCX)
    runs-on: ubuntu-latest
    # Actual run time is ~5 min (xelatex dominates, ~3s × 380 fixtures
    # / 4-way pool). 15 min budget catches a stuck job without letting
    # it burn 25 min of runner time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: install xelatex + pandoc + poppler
        # texlive-xetex pulls in the engine + ulem + hyperref + the
        # font packages (txfonts, txfontsb) we use. tabularx + enumitem
        # come from texlive-latex-extra. pandoc ships standalone (3.x
        # in current Ubuntu). ~120MB total install.
        #
        # poppler-utils supplies pdftotext + pdfinfo. The render tests
        # (by-direction-render, appended-endorsement-render) read text and
        # page counts off a compiled PDF and skip themselves when those
        # binaries are absent — so without this they passed by not running.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            pandoc \
            poppler-utils

      - run: npm ci

      - name: run integration matrix
        run: npm run test:integration

      - name: upload failing tex dirs
        # On failure, the harness leaves /tmp/dondocs-compile-XXXX dirs
        # with the .tex files + log so a dev can `cd` in and reproduce.
        # Pull them out as artifacts to make CI failures debuggable.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failing-compile-artifacts
          path: |
            /tmp/dondocs-compile-*
            /tmp/dondocs-docx-*
          retention-days: 7
          if-no-files-found: ignore

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    # A real gate, deliberately. The generator only reads the lockfile and the
    # installed tree, so it doesn't flake — and if it *can't* read them, that's
    # a signal about the dependency tree worth failing on, not swallowing. The
    # alternative (continue-on-error) reports green while the artifact quietly
    # stops being produced, which is the worst outcome for a file whose whole
    # job is to be citable evidence.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # Production dependencies only — devDependencies aren't shipped, so
      # listing them would misrepresent what the app actually runs.
      - name: generate SBOM
        run: npm run sbom

      # A zero-exit generator can still leave an empty or shapeless file, which
      # would upload happily and be useless to whoever cites it. Check the
      # artifact itself: right subject, and every component carries the fields
      # that make an SBOM machine-usable (purl / version / license).
      - name: validate SBOM
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const sbom = JSON.parse(readFileSync("sbom.cdx.json", "utf-8"));
            const pkg = JSON.parse(readFileSync("package.json", "utf-8"));
            const fail = (msg) => { console.error(`::error::SBOM ${msg}`); process.exit(1); };

            if (sbom.bomFormat !== "CycloneDX") fail(`bomFormat is ${sbom.bomFormat}, expected CycloneDX`);
            if (sbom.metadata?.component?.name !== pkg.name) {
              fail(`describes "${sbom.metadata?.component?.name}", expected "${pkg.name}"`);
            }

            const components = sbom.components ?? [];
            if (components.length === 0) fail("lists no components");

            // Every direct production dependency must appear. CycloneDX splits
            // scoped packages into group + name, so rebuild the real id.
            const present = new Set(components.map((c) => (c.group ? `${c.group}/${c.name}` : c.name)));
            const missing = Object.keys(pkg.dependencies ?? {}).filter((d) => !present.has(d));
            if (missing.length) fail(`omits production dependencies: ${missing.join(", ")}`);

            for (const field of ["purl", "version", "licenses"]) {
              const bad = components.filter((c) => !c[field]?.length);
              if (bad.length) fail(`has ${bad.length} component(s) with no ${field} (e.g. ${bad[0].name})`);
            }

            console.log(`SBOM OK — ${components.length} components, ${Object.keys(pkg.dependencies ?? {}).length} direct prod deps present`);
          '

      - name: upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
