name: release

# Prepare a GitHub release when package.json's version is bumped on main.
# Keep 1.3.0 as a draft until a maintainer publishes it; that publication
# triggers docker-release.yml. Other versions retain automatic publication.
# Re-runs skip releases that already exist.
#
# Uses the built-in GITHUB_TOKEN with `contents: write` — which, unlike a PAT
# or OAuth token, can tag even commits that touch .github/workflows, so this
# never hits the "workflow scope required" wall that blocks manual `gh release`.

on:
  push:
    branches: [main]
    paths: ['package.json']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The companion as a client installs it: the built server packed as an
      # MCP Bundle, with its checksum beside it.
      - name: Build the MCP Bundle
        run: |
          npm ci
          npm run build:companion
          npm run build:mcpb

      - name: Create release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do."
            exit 0
          fi
          # Notes = this version's CHANGELOG section (body under the heading).
          awk -v n="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\["n"\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            printf 'Release %s\n' "$tag" > notes.md
          fi
          release_flags=()
          if [ "${{ steps.v.outputs.version }}" = "1.3.0" ]; then
            release_flags+=(--draft)
          fi
          gh release create "$tag" --target "${{ github.sha }}" --title "$tag" --notes-file notes.md "${release_flags[@]}" \
            "dist-mcpb/dondocs-${{ steps.v.outputs.version }}.mcpb" \
            "dist-mcpb/dondocs-${{ steps.v.outputs.version }}.mcpb.sha256"
