<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS Add-to-Home-Screen: iOS ignores SVG and the manifest icons here.
         The PNG is rasterized from icon.svg at build time (generate-icons.mjs)
         so the home-screen icon can never drift from the brand mark. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The standard meta first; the apple- variant alone triggers a Chrome
         deprecation warning. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" (opaque bar, theme-adaptive text), NOT "black-translucent":
         translucent makes the installed app full-bleed with white status text,
         and the shell has no safe-area-inset-top handling — the header would
         render under the notch and the clock would vanish on the light canvas.
         Revisit alongside top safe-area support. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DonDocs" />
    <!-- Preload the welcome-letter artwork so it paints with the text instead
         of popping in a beat later (shown the moment a new user lands; the
         seal also serves as the app background watermark). -->
    <link rel="preload" as="image" href="/attachments/marine-coders-banner.webp" type="image/webp" />
    <link rel="preload" as="image" href="/attachments/marine-coders-logo.svg" type="image/svg+xml" />
    <!-- Preload the primary (latin) brand font so it's ready by first paint —
         prevents the unstyled-text flash/reflow as Geist swaps in. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-latin-wght-normal.woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tint the mobile browser / installed-PWA chrome to match the app canvas
         in each color scheme (values mirror index.css's sRGB --background fallbacks). -->
    <meta name="theme-color" content="#f1f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Free SECNAV M-5216.5 correspondence & form generator for Navy/USMC. 20 document types — naval letters, memoranda, endorsements, NAVMC forms. PDF/DOCX export, 100% browser-based, works offline." />
    <meta property="og:title" content="DonDocs - Naval Correspondence & Form Generator" />
    <meta property="og:description" content="Create SECNAV M-5216.5 compliant naval letters, memoranda, endorsements & NAVMC forms. 20 document types for Navy/USMC. PDF & DOCX export, no servers — works on NMCI and air-gapped networks." />
    <meta property="og:type" content="website" />
    <title>DonDocs - Naval Correspondence & Form Generator</title>
    <!-- Prevent theme flash by applying correct theme before first paint -->
    <script>
      (function() {
        try {
          // Check for saved theme in localStorage (Zustand persist storage)
          var stored = localStorage.getItem('dondocs_ui');
          if (stored) {
            var parsed = JSON.parse(stored);
            var savedTheme = parsed && parsed.state && parsed.state.theme;
            if (savedTheme === 'dark' || savedTheme === 'light') {
              document.documentElement.classList.toggle('dark', savedTheme === 'dark');
              return;
            }
          }
          // No saved preference - use system preference
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // Fallback: check system preference
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>
    <!-- Boot watchdog: self-heal a stale/broken app shell instead of leaving a
         white or unstyled screen. Two failure modes, one recovery:
           1. Stale shell — a cached index.html references hashed bundles that no
              longer exist, so the JS never boots (window.__DD_BOOTED__ stays
              unset). The 1.2.94 white-screen incident.
           2. Poisoned stylesheet — the JS boots but a stale service worker serves
              a bad /assets/*.css, so the app renders UNSTYLED. Booting alone is
              therefore NOT health: we also require our --background token to have
              resolved, which only happens if the stylesheet actually applied.
              Without this, the app's own "update available" prompt can't rescue
              the user — it's a React component, invisible without CSS.
         When neither holds and we're online, this unregisters the service
         worker (so the healing reload isn't intercepted and fetches fresh
         assets straight from the network), drops the shell caches,
         force-revalidates the page in the HTTP cache, and reloads ONCE.
         Recovery has two triggers: a FAST one — a shell stylesheet firing its
         error event (the 404 case, healed the moment it lands instead of
         after seconds of unstyled page) — and a 10s timer that catches
         everything else. Guarded per DISTINCT shell so it can never loop;
         IndexedDB/localStorage (saved documents) are never touched; offline is
         left alone — the cached shell is all an air-gapped machine has. This
         exact block is extracted and exercised end-to-end by
         tests/regressions/boot-watchdog-stale-shell.ts. -->
    <script id="boot-watchdog">
      (function () {
        try {
          var KEY = 'dondocs-boot-recovery';
          // Our stylesheet defines --background on :root. If it resolves empty,
          // the stylesheet never applied — the shell is unstyled/broken.
          function stylesApplied() {
            try {
              return getComputedStyle(document.documentElement)
                .getPropertyValue('--background').trim() !== '';
            } catch (e) { return true; } // can't tell → assume fine, never nuke blindly
          }
          // The one-shot recovery, shared by the slow timer below and the fast
          // stylesheet-failure trigger. Guarded per DISTINCT broken shell, not
          // per tab session: the module script's hashed src fingerprints the
          // build this shell belongs to. Guarding on the bare session left a
          // tab stuck when the first heal didn't take (a stale SW re-served a
          // different stale shell) — a new fingerprint means a new failure
          // worth one more attempt, while the same shell can still never loop.
          function heal() {
            try {
              if (!navigator.onLine) return;
              var s = document.querySelector('script[type="module"][src]');
              var shellId = (s && s.getAttribute('src')) || 'unknown';
              if (sessionStorage.getItem(KEY) === shellId) return;
              sessionStorage.setItem(KEY, shellId);
              var reload = function () { location.reload(); };
              // Unregister the worker: the poisoned CSS is served BY the stale SW,
              // so the reload must not be intercepted by it. With no controller,
              // the healing load fetches the current hashed assets from the
              // network. Engine caches are left intact so offline compile survives.
              var unregisterSW = ('serviceWorker' in navigator)
                ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister(); }));
                  }).catch(function () {})
                : Promise.resolve();
              var dropShellCaches = ('caches' in window)
                ? caches.keys().then(function (keys) {
                    return Promise.all(keys
                      .filter(function (k) { return k.indexOf('dondocs-app-shell') === 0; })
                      .map(function (k) { return caches.delete(k); }));
                  }).catch(function () {})
                : Promise.resolve();
              // cache:'reload' bypasses the HTTP cache and replaces the stored
              // entry with a fresh copy, so the reload below can't re-read the
              // same stale shell.
              var refreshShell = fetch(location.href, { cache: 'reload' }).catch(function () {});
              Promise.all([unregisterSW, dropShellCaches, refreshShell]).then(reload, reload);
            } catch (e) { /* never break boot */ }
          }
          // Fast path: a shell stylesheet that fails to load fires a capture-
          // phase error event the moment the 404/failure lands — heal right
          // then instead of leaving the user on an unstyled page until the
          // timer. Only our own hashed assets count, and only when the styles
          // really are missing, so an unrelated resource error can't nuke a
          // healthy session. (Resource errors don't bubble; capture is the
          // only way to see them from here.)
          if (window.addEventListener) {
            window.addEventListener('error', function (e) {
              try {
                var t = e && e.target;
                if (!t || t.tagName !== 'LINK') return;
                if ((t.rel || '') !== 'stylesheet') return;
                if (String(t.href || '').indexOf('/assets/') === -1) return;
                if (stylesApplied()) return;
                heal();
              } catch (err) { /* never break boot */ }
            }, true);
          }
          // Slow path: catches everything else (blank shell, hung requests,
          // a worker serving nothing at all).
          setTimeout(function () {
            try {
              if (window.__DD_BOOTED__ && stylesApplied()) { sessionStorage.removeItem(KEY); return; }
              heal();
            } catch (e) { /* never break boot */ }
          }, 10000);
        } catch (e) { /* never break boot */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
